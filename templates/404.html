{% extends "base.html" %}


{% block title %}
    Página não encontrada | UserFlow
{% endblock %}


{% block content %}

<section class="error-page">

    <div class="error-code">
        404
    </div>

    <h1>Não encontramos essa página.</h1>

    <p>
        O endereço acessado não existe ou o registro solicitado
        não está mais disponível.
    </p>

    <a href="{{ url_for('index') }}" class="button button-primary">
        Voltar ao painel
    </a>

</section>

{% endblock %}
